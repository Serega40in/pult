name: PULT source checks

on:
  pull_request:
    paths:
      - "extension/**"
      - "supabase/functions/qun-agent-core/**"
      - "supabase/migrations/**"
      - ".github/workflows/pult-source-checks.yml"
  push:
    branches:
      - feat/pult-agent-command-hub
    paths:
      - "extension/**"
      - "supabase/functions/qun-agent-core/**"
      - "supabase/migrations/**"
      - ".github/workflows/pult-source-checks.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check extension JavaScript syntax
        run: |
          node --check extension/background.js
          node --check extension/popup.js
          node --check extension/chatgpt.js

      - name: Check extension manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check QUN Agent Core TypeScript
        run: deno check --no-lock --config supabase/functions/qun-agent-core/deno.json supabase/functions/qun-agent-core/index.ts
