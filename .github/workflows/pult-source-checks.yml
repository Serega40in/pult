name: PULT source checks

on:
  pull_request:
    paths:
      - "server/php-api/**"
      - "extension/**"
      - ".github/workflows/pult-source-checks.yml"
  push:
    branches:
      - feat/pult-agent-command-hub
    paths:
      - "server/php-api/**"
      - "extension/**"
      - ".github/workflows/pult-source-checks.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Check PHP syntax
        run: |
          php -l server/php-api/index.php
          php -l server/php-api/config.example.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check extension JavaScript syntax
        run: |
          node --check extension/background.js
          node --check extension/popup.js
          node --check extension/chatgpt.js

      - name: Check extension manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"
