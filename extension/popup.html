<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; margin: 0; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 13px; color: #555; margin: 0 0 12px; }
    button { width: 100%; padding: 8px; margin: 4px 0; cursor: pointer; }
    textarea { width: 100%; height: 80px; font-size: 12px; }
    .status { font-size: 12px; margin-top: 8px; color: #0a0; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>PULT Browser Agent</h1>
  <p>Вставь JSON-план от ИИ и нажми «Выполнить». Действия только на текущей вкладке.</p>
  <textarea id="plan" placeholder='{"steps":[{"action":"navigate","url":"https://example.com"},{"action":"scroll","y":300}]}'></textarea>
  <button id="run">Выполнить план</button>
  <button id="example">Пример</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
