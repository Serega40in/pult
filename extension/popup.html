<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PULT Lite</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">P</div>
      <div><h1>PULT Lite</h1><p>Управление вкладкой через ChatGPT</p></div>
    </header>
    <section>
      <label for="target">Вкладка для управления</label>
      <div class="line"><select id="target"></select><button id="refresh" class="secondary" title="Обновить список">↻</button></div>
      <div id="selectedUrl" class="muted"></div>
      <button id="read" class="primary">Прочитать страницу</button>
      <textarea id="pageText" rows="7" placeholder="Текст страницы появится здесь…" readonly></textarea>
      <button id="copyPage" class="secondary full" disabled>Скопировать текст страницы</button>
    </section>
    <section>
      <label for="plan">Команда PULT (JSON)</label>
      <textarea id="plan" rows="7" spellcheck="false" placeholder='{"steps":[{"action":"read_page"}]}'></textarea>
      <button id="run" class="primary">Проверить и выполнить</button>
      <pre id="result" aria-live="polite">Готов к работе.</pre>
    </section>
    <footer>Выполнение начинается только после твоего нажатия. Пароли и отправка форм защищены.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
